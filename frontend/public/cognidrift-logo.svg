<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="24" cy="24" r="22" stroke="url(#grad1)" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Middle ring with animation effect -->
  <circle cx="24" cy="24" r="18" stroke="url(#grad1)" stroke-width="2.5" fill="none" opacity="0.6">
    <animate attributeName="r" values="18;20;18" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner solid circle -->
  <circle cx="24" cy="24" r="16" fill="url(#grad1)"/>
  
  <!-- AI brain icon -->
  <g transform="translate(24, 24)">
    <!-- Left brain hemisphere -->
    <path d="M -6,-8 Q -10,-8 -10,-4 Q -10,0 -8,2 Q -6,4 -3,4 L -3,-8 Z" fill="white" opacity="0.9"/>
    
    <!-- Right brain hemisphere -->
    <path d="M 6,-8 Q 10,-8 10,-4 Q 10,0 8,2 Q 6,4 3,4 L 3,-8 Z" fill="white" opacity="0.9"/>
    
    <!-- Neural connections -->
    <circle cx="-5" cy="-4" r="1.5" fill="white" opacity="0.7"/>
    <circle cx="5" cy="-4" r="1.5" fill="white" opacity="0.7"/>
    <circle cx="-5" cy="0" r="1.5" fill="white" opacity="0.7"/>
    <circle cx="5" cy="0" r="1.5" fill="white" opacity="0.7"/>
    
    <!-- Center connection -->
    <line x1="-3" y1="-2" x2="3" y2="-2" stroke="white" stroke-width="1.5" opacity="0.5"/>
    <line x1="-3" y1="1" x2="3" y2="1" stroke="white" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Bottom wave (voice representation) -->
    <path d="M -8,6 Q -6,8 -4,6 T 0,6 T 4,6 T 8,6" stroke="white" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round">
      <animate attributeName="d" 
        values="M -8,6 Q -6,8 -4,6 T 0,6 T 4,6 T 8,6;
                M -8,6 Q -6,4 -4,6 T 0,6 T 4,6 T 8,6;
                M -8,6 Q -6,8 -4,6 T 0,6 T 4,6 T 8,6" 
        dur="1.5s" 
        repeatCount="indefinite"/>
    </path>
  </g>
</svg>
